name: GSoC issue watcher

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs at busy times.
    - cron: "*/30 * * * *"
  workflow_dispatch:      # lets you trigger a run by hand from the Actions tab
    inputs:
      test_notification:
        description: "Send a test notification instead of checking for issues"
        type: boolean
        default: false

permissions:
  contents: write         # needed to commit seen.json back

concurrency:
  group: gsoc-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for free issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py ${{ inputs.test_notification && '--test' || '' }}

      - name: Save state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json latest.md
          # Nothing to do when the state is unchanged.
          git diff --staged --quiet || git commit -m "state: Update watcher results."
          git push
